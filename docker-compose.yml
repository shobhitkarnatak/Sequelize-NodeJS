services:
  app:
    build: .
    container_name: my-node-app
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: myapp
      DB_USER: user
      DB_PASSWORD: admin@123

    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: my-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: admin@123
      MYSQL_DATABASE: myapp
      MYSQL_USER: user
      MYSQL_PASSWORD: admin@123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
